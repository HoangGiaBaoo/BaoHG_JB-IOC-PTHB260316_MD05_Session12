server {
    listen 443 ssl;
    server_name secure.example.com;

    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    # ===== HTTP Security Headers =====
    # Chống Clickjacking: chỉ cho phép nhúng trang vào iframe cùng origin
    add_header X-Frame-Options "SAMEORIGIN" always;
    # Chống MIME-sniffing: trình duyệt phải tôn trọng Content-Type server trả về
    add_header X-Content-Type-Options "nosniff" always;
    # HSTS: bắt buộc trình duyệt dùng HTTPS trong 1 năm, áp dụng cho cả subdomain
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://localhost:8080;

        # Ẩn các header cùng tên do backend (vd. Spring Security) tự gửi,
        # tránh response chứa 2 giá trị mâu thuẫn (DENY và SAMEORIGIN).
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Strict-Transport-Security;
    }
}
