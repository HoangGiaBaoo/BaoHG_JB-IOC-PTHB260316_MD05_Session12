server {
    listen 80;
    server_name api.example.com;

    location /api/export/ {
        proxy_pass http://localhost:8080;

        # Timeout cho API export báo cáo (~90s xử lý) -> nâng lên 120s
        proxy_connect_timeout 60s;    # Thời gian tối đa để Nginx thiết lập kết nối TCP tới backend
        proxy_send_timeout    120s;   # Thời gian tối đa giữa 2 lần ghi liên tiếp khi gửi request tới backend
        proxy_read_timeout    120s;   # Thời gian tối đa giữa 2 lần đọc liên tiếp response từ backend (nguyên nhân gây 504)
        send_timeout          120s;   # Thời gian tối đa giữa 2 lần ghi liên tiếp khi gửi response về client
    }
}
